<style>
.dtm-test-page{max-width:900px;margin:0 auto;padding:28px 16px 60px}.dtm-test-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.dtm-test-title{margin:0;color:#08172d;font-size:clamp(24px,4vw,34px)}.dtm-test-progress{color:#64748b;font-weight:700;white-space:nowrap}.dtm-progress{height:8px;background:#e8edf5;border-radius:99px;overflow:hidden;margin-bottom:24px}.dtm-progress>span{display:block;height:100%;background:#3157c7;width:0;transition:width .2s}.dtm-question{background:#fff;border:1px solid #e8edf5;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(15,23,42,.06)}.dtm-question__text{font-size:18px;line-height:1.55;color:#0f172a;font-weight:600;white-space:pre-wrap}.dtm-question__image{display:block;max-width:100%;max-height:360px;margin:18px auto;border-radius:12px;border:1px solid #e5e7eb}.dtm-options{display:grid;gap:11px;margin-top:20px}.dtm-option{border:1px solid #dbe2ec;background:#f8fafc;border-radius:13px;padding:13px 15px;text-align:left;font:inherit;cursor:pointer;transition:.15s}.dtm-option:hover{border-color:#3157c7;background:#f2f5ff}.dtm-option.selected{border-color:#3157c7;background:#eaf0ff}.dtm-actions{display:flex;justify-content:space-between;gap:12px;margin-top:16px}.dtm-btn{border:0;border-radius:13px;padding:12px 18px;font-weight:700;cursor:pointer}.dtm-btn--back{background:#eef2f7;color:#334155}.dtm-btn--next{background:#08172d;color:#fff}.dtm-result{background:#fff;border:1px solid #e8edf5;border-radius:20px;padding:28px;text-align:center;box-shadow:0 10px 30px rgba(15,23,42,.06)}.dtm-result h2{margin-top:0;font-size:30px}.dtm-score{font-size:48px;font-weight:800;color:#3157c7}.dtm-result p{color:#64748b}.dtm-result__actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}.dtm-link{display:inline-block;text-decoration:none;border-radius:12px;padding:11px 16px;font-weight:700;background:#08172d;color:#fff}.dtm-link.secondary{background:#eef2f7;color:#334155}@media(max-width:600px){.dtm-test-head{align-items:flex-start;flex-direction:column}.dtm-question{padding:17px}.dtm-actions .dtm-btn{flex:1}}
</style>
</head><body>
