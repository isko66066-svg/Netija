name: Format NatCert tests

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'Format NatCert tests') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Format test files
        run: npx --yes prettier@3.6.2 --write js/questions/natcert-11.js js/questions/natcert-12.js

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/questions/natcert-11.js js/questions/natcert-12.js
          git diff --cached --quiet || git commit -m "Format NatCert tests"
          git push
