<body>
    <header class="header">
        <div class="header__container">
            <nav class="header__nav">
                <img class="logo" src="./images/logo.svg" alt="">
                <ul class="header__list">
                    <li class="header__list-item"><a class="header__list-link" href="index.html">Главная страница</a></li>
                    <li class="header__list-item"><a class="header__list-link" href="/">Дтм</a></li>

                </div>

        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="2026">2026</button>
            <button class="filter-btn" data-filter="2025">2025</button>
            <button class="filter-btn" data-filter="2024">2024</button>

        <div class="test-cards" id="testCards"></div>

    <script src="js/auth.js"></script>
