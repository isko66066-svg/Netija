<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netija — Национальный сертификат</title>
    <link rel="stylesheet" href="style.css?v=20260822">
    <link rel="shortcut icon" href="./images/favicon.svg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* ===== National certificate: exact reference alignment ===== */
        .main__natcert::before,
        .main__natcert::after {
            content: none !important;
            display: none !important;
        }

        .main__natcert .test-card__title::before,
        .main__natcert .test-card__count::before,
        .main__natcert .card-badge::before,
        .main__natcert .btn-card-action::after {
            display: none !important;
            content: none !important;
        }

        .main__natcert .test-card__title-icon {
            position: static !important;
            width: 56px !important;
            height: 56px !important;
            min-width: 56px !important;
            flex: 0 0 56px !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 13px !important;
            border-radius: 15px !important;
            background: var(--card-soft) !important;
            color: var(--card-accent) !important;
        }

        .main__natcert .test-card__title-icon svg {
            width: 30px !important;
            height: 30px !important;
            display: block !important;
        }

        .main__natcert .test-card__title {
            gap: 14px !important;
            min-height: 56px !important;
        }

        .main__natcert .test-card__count {
            margin: 0 !important;
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
            color: #7b8798 !important;
        }

        .main__natcert .test-card__count-icon {
            position: static !important;
            width: 17px !important;
            height: 17px !important;
            min-width: 17px !important;
            flex: 0 0 17px !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            color: #8d9aab !important;
        }

        .main__natcert .test-card__count-icon svg {
            width: 17px !important;
            height: 17px !important;
            display: block !important;
        }

        .main__natcert .card-badge {
            gap: 9px !important;
        }

        .main__natcert .card-badge__icon {
            position: static !important;
            width: 21px !important;
            height: 21px !important;
            min-width: 21px !important;
            flex: 0 0 21px !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            color: inherit !important;
        }

        .main__natcert .card-badge__icon svg {
            width: 21px !important;
            height: 21px !important;
            display: block !important;
        }

        .main__natcert .card-badge__text {
            margin: 0 !important;
        }

        .main__natcert .btn-card-action {
            justify-content: flex-start !important;
            padding-left: 24px !important;
        }

        /* Compact reference-style year navigation */
        .main__natcert .filter-container {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            width: 100% !important;
            min-height: 68px !important;
            margin-top: 38px !important;
            margin-bottom: 24px !important;
            padding: 6px !important;
            background: rgba(255,255,255,.92) !important;
            border: 1px solid #e0e6ef !important;
            border-radius: 17px !important;
            box-shadow: 0 8px 26px rgba(30,64,175,.055) !important;
            backdrop-filter: blur(10px) !important;
        }

        .main__natcert .filter-btn,
        .main__natcert .filter-btn[data-filter="all"] {
            position: relative !important;
            width: 112px !important;
            min-width: 112px !important;
            height: 50px !important;
            padding: 0 14px !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 9px !important;
            border: 1px solid #dfe5ed !important;
            border-radius: 999px !important;
            background: #fff !important;
            color: #59677b !important;
            font-size: 16px !important;
            font-weight: 650 !important;
            line-height: 1 !important;
            box-shadow: none !important;
            cursor: pointer !important;
        }

        .main__natcert .filter-btn[data-filter]:not([data-filter="all"])::before {
            content: "" !important;
            display: block !important;
            width: 24px !important;
            height: 24px !important;
            flex: 0 0 24px !important;
            border: 2px solid #98a2ad !important;
            border-radius: 5px !important;
            background: transparent !important;
            box-sizing: border-box !important;
        }

        .main__natcert .filter-btn.active[data-filter]:not([data-filter="all"])::before {
            border-color: #aeb8c4 !important;
            background: transparent !important;
        }

        .main__natcert .filter-btn.active[data-filter]:not([data-filter="all"])::after {
            content: "" !important;
            position: absolute !important;
            left: 14px !important;
            top: 50% !important;
            width: 24px !important;
            height: 24px !important;
            display: block !important;
            transform: translateY(-50%) !important;
            background: linear-gradient(135deg, transparent 43%, #aeb8c4 43%, #aeb8c4 55%, transparent 55%), linear-gradient(45deg, transparent 48%, #aeb8c4 48%, #aeb8c4 58%, transparent 58%) !important;
            background-size: 11px 18px, 8px 10px !important;
            background-position: 2px 5px, 10px 2px !important;
            background-repeat: no-repeat !important;
        }

        .main__natcert .filter-btn[data-filter="all"]::before {
            content: "" !important;
            width: 22px !important;
            height: 22px !important;
            flex: 0 0 22px !important;
            border: 0 !important;
            border-radius: 3px !important;
            background:
                linear-gradient(currentColor 0 0) 0 0 / 8px 8px,
                linear-gradient(currentColor 0 0) 14px 0 / 8px 8px,
                linear-gradient(currentColor 0 0) 0 14px / 8px 8px,
                linear-gradient(currentColor 0 0) 14px 14px / 8px 8px !important;
            background-repeat: no-repeat !important;
        }

        .main__natcert .filter-btn.active {
            background: #11118b !important;
            border-color: #11118b !important;
            color: #fff !important;
            box-shadow: 0 8px 18px rgba(17,17,139,.22) !important;
        }

        .main__natcert .filter-btn:hover:not(.active) {
            background: #fff !important;
            border-color: #cfd8e6 !important;
            color: #59677b !important;
            transform: none !important;
        }

        /* Reference graduation-cap badge */
        .main__natcert .natcert-title-row {
            position: relative !important;
            z-index: 3 !important;
            display: flex !important;
            align-items: center !important;
            gap: 24px !important;
            max-width: 900px !important;
            margin: 0 !important;
        }

        .main__natcert .natcert-title-icon {
            width: 78px !important;
            height: 78px !important;
            min-width: 78px !important;
            flex: 0 0 78px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            background: #eeeaff !important;
            color: #5c43dc !important;
            clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%) !important;
            box-shadow: 0 8px 20px rgba(98,70,229,.10) !important;
        }

        .main__natcert .natcert-title-icon svg {
            width: 43px !important;
            height: 43px !important;
            display: block !important;
        }

        .main__natcert .natcert-title-icon svg path:first-child {
            fill: currentColor !important;
            fill-opacity: .22 !important;
        }

        .main__natcert .test-title {
            font-weight: 800 !important;
        }

        .main__natcert .test-subtitle {
            font-size: 17px !important;
            font-weight: 500 !important;
            line-height: 1.55 !important;
            color: #718096 !important;
        }

        .main__natcert .test-subtitle::after {
            margin-top: 5px !important;
            color: #8a96a8 !important;
            font-size: 14px !important;
            font-weight: 400 !important;
            line-height: 1.5 !important;
        }

        .main__natcert .natcert-hero-art {
            right: 18px !important;
            top: 4px !important;
            width: 340px !important;
            height: 250px !important;
            z-index: 2 !important;
        }

        @media (max-width: 1050px) {
            .main__natcert .natcert-hero-art { right: -35px !important; opacity: .75; }
        }

        @media (max-width: 700px) {
            .main__natcert .filter-container {
                gap: 5px !important;
                min-height: 58px !important;
                padding: 4px !important;
                margin-top: 26px !important;
                border-radius: 14px !important;
            }

            .main__natcert .filter-btn,
            .main__natcert .filter-btn[data-filter="all"] {
                width: auto !important;
                min-width: 0 !important;
                flex: 1 1 0 !important;
                height: 44px !important;
                padding: 0 6px !important;
                gap: 5px !important;
                font-size: 12px !important;
            }

            .main__natcert .filter-btn[data-filter]:not([data-filter="all"])::before {
                width: 18px !important;
                height: 18px !important;
                flex-basis: 18px !important;
                border-radius: 4px !important;
            }

            .main__natcert .filter-btn.active[data-filter]:not([data-filter="all"])::after {
                left: 50% !important;
                margin-left: -9px !important;
                width: 18px !important;
                height: 18px !important;
                transform: translate(-50%, -50%) !important;
                background-size: 8px 14px, 6px 8px !important;
                background-position: 1px 4px, 8px 2px !important;
            }

            .main__natcert .filter-btn[data-filter="all"]::before {
                width: 18px !important;
                height: 18px !important;
                flex-basis: 18px !important;
                background:
                    linear-gradient(currentColor 0 0) 0 0 / 7px 7px,
                    linear-gradient(currentColor 0 0) 11px 0 / 7px 7px,
                    linear-gradient(currentColor 0 0) 0 11px / 7px 7px,
                    linear-gradient(currentColor 0 0) 11px 11px / 7px 7px !important;
                background-repeat: no-repeat !important;
            }

            .main__natcert .natcert-title-row { gap: 14px !important; }
            .main__natcert .natcert-title-icon {
                width: 58px !important;
                height: 58px !important;
                min-width: 58px !important;
                flex-basis: 58px !important;
            }
            .main__natcert .natcert-title-icon svg { width: 34px !important; height: 34px !important; }
            .main__natcert .test-subtitle { font-size: 16px !important; font-weight: 500 !important; }
            .main__natcert .test-subtitle::after { font-size: 13px !important; font-weight: 400 !important; }
            .main__natcert .natcert-hero-art { display: none !important; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header__container">
            <nav class="header__nav">
                <a class="site-header__logo" href="index.html" aria-label="Netija">
                    <img class="logo" src="./images/logo.svg" alt="Netija">
                </a>
                <ul class="header__list">
                    <li class="header__list-item"><a class="header__list-link" href="index.html">Главная страница</a></li>
                    <li class="header__list-item"><a class="header__list-link" href="/">Дтм</a></li>
                    <li class="header__list-item"><a class="header__list-link active" href="natcert.html">Национальный сертификат</a></li>
                </ul>
                <div class="site-header__account">
                    <a class="premium-nav-link" href="premium.html">👑 Premium</a>
                    <div class="sign__button" id="googleSignInButton"></div>
                    <div id="userProfile" class="user-profile" style="display: none;">
                        <img id="userAvatar" class="user-profile__avatar" src="" alt="">
                        <span id="userName" class="user-profile__name"></span>
                    </div>
                    <button class="burger" id="burgerBtn" type="button" aria-label="Меню">
                        <span></span><span></span><span></span>
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <main class="main__natcert" id="main">
        <div class="natcert-hero-art" aria-hidden="true" style="position:absolute;right:20px;top:10px;width:330px;height:240px;z-index:1;pointer-events:none;">
            <svg viewBox="0 0 300 220" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="paper" x1="70" y1="30" x2="240" y2="190" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#F7F3FF"/><stop offset="1" stop-color="#DCD2FF"/>
                    </linearGradient>
                    <linearGradient id="purple" x1="85" y1="40" x2="210" y2="175" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#927AEF"/><stop offset="1" stop-color="#6246E5"/>
                    </linearGradient>
                    <filter id="shadow" x="25" y="15" width="250" height="205" filterUnits="userSpaceOnUse">
                        <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#6E55D8" flood-opacity=".18"/>
                    </filter>
                </defs>
                <ellipse cx="154" cy="190" rx="104" ry="15" fill="#BEB1F7" fill-opacity=".35"/>
                <g filter="url(#shadow)" transform="rotate(5 150 105)">
                    <rect x="67" y="25" width="166" height="145" rx="22" fill="url(#paper)"/>
                    <rect x="88" y="54" width="95" height="10" rx="5" fill="#927AEF" fill-opacity=".75"/>
                    <rect x="88" y="77" width="122" height="9" rx="4.5" fill="#A999F2" fill-opacity=".55"/>
                    <rect x="88" y="98" width="88" height="9" rx="4.5" fill="#A999F2" fill-opacity=".55"/>
                    <rect x="88" y="119" width="108" height="9" rx="4.5" fill="#A999F2" fill-opacity=".45"/>
                    <circle cx="190" cy="139" r="22" fill="#F5C44F"/><circle cx="190" cy="139" r="14" fill="#FFD96C"/>
                    <path d="M181 156L190 148L199 156V179L190 173L181 179V156Z" fill="url(#purple)"/>
                </g>
                <path d="M52 54L56 64L67 65L58 72L61 83L52 77L43 83L46 72L37 65L48 64L52 54Z" fill="#927AEF" fill-opacity=".85"/>
                <path d="M245 68L248 75L256 76L250 81L252 89L245 85L238 89L240 81L234 76L242 75L245 68Z" fill="#927AEF" fill-opacity=".6"/>
                <circle cx="266" cy="40" r="8" stroke="#A99AF0" stroke-width="4" opacity=".55"/>
            </svg>
        </div>

        <div class="natcert-title-row">
            <span class="natcert-title-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 9L12 4L21 9L12 14L3 9Z" fill="currentColor" fill-opacity=".22" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M6 11.2V15.5C7.8 17 9.8 17.8 12 17.8C14.2 17.8 16.2 17 18 15.5V11.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    <path d="M21 9V14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
            </span>
            <h1 class="test-title" style="margin:0;">Национальный сертификат</h1>
        </div>
        <p class="test-subtitle">Выбери тест и начни подготовку</p>

        <div class="filter-container" aria-label="Фильтр по году">
            <button class="filter-btn active" data-filter="all" type="button">Все</button>
            <button class="filter-btn" data-filter="2026" type="button">2026</button>
            <button class="filter-btn" data-filter="2025" type="button">2025</button>
            <button class="filter-btn" data-filter="2024" type="button">2024</button>
        </div>
        <div class="test-cards" id="testCards"></div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/premium-header.js"></script>
    <script src="js/natcert_tests-list.js"></script>
    <script src="js/render-cards.js"></script>
    <script src="js/router.js"></script>
</body>
</html>
