<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест | Netija</title>
    <script>
window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], macros: { tg: "\\operatorname{tg}", ctg: "\\operatorname{ctg}" } }, svg: { fontCache: 'global' } };
</script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="test.css">
    <link rel="stylesheet" href="exam-overrides.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="premium.css">
    <link rel="shortcut icon" href="./images/favicon.svg" type="image/x-icon">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="exam-body">
    <header class="exam-header">
        <div class="exam-header__inner">
            <a class="exam-brand" href="index.html" aria-label="Netija"><span class="exam-brand__mark">✓</span><span class="exam-brand__text">NETIJA</span></a>
            <nav class="exam-nav" aria-label="Основная навигация">
                <a href="index.html">Главная</a><a href="natcert.html" class="is-active">Тесты</a><a href="/">Марафон</a><a href="/">Подборки</a><a href="/">Статистика</a><a href="premium.html">Цены</a>
            </nav>
            <div class="exam-header__actions">
                <a href="premium.html" class="exam-premium">♛ <span>Premium</span></a>
                <button class="exam-notification" type="button" aria-label="Уведомления">♧<span class="exam-notification__badge">1</span></button>
                <div class="sign__button" id="googleSignInButton"></div>
                <div id="userProfile" class="user-profile" style="display:none;"><img id="userAvatar" class="user-profile__avatar" src="" alt=""><span id="userName" class="user-profile__name"></span></div>
                <button class="burger exam-burger" id="burgerBtn" aria-label="Меню"><span></span><span></span><span></span></button>
            </div>
        </div>
    </header>

    <main class="exam-page" id="main">
        <div class="exam-layout">
            <section class="questions-area">
                <div class="exam-testbar"><div class="exam-testbar__info"><div class="exam-testbar__title" id="testTitle">Загрузка теста...</div><div class="exam-testbar__progress">Вопрос <strong id="currentQuestion">1</strong> из <strong id="totalQuestions">45</strong></div></div><div class="exam-testbar__timer"><span class="exam-clock">◷</span><div><strong id="timer">02:30:00</strong><small>Оставшееся время</small></div></div><button id="submitBtn" class="finish-test" type="button">Завершить тест</button></div>
                <div id="quizContainer"></div>
            </section>
            <aside class="questions-sidebar">
                <div class="sidebar-timer"><span class="exam-clock">◷</span><div><strong id="sidebarTimer">02:30:00</strong><small>Оставшееся время</small></div></div>
                <h2>Вопросы</h2>
                <div class="question-status"><span class="status-dot answered"></span>Ответ дан</div><div class="question-status"><span class="status-dot current"></span>Текущий вопрос</div><div class="question-status"><span class="status-dot empty"></span>Ответ не дан</div>
                <div class="question-grid" id="questionGrid"></div>
                <button class="check-answers" type="button" onclick="document.getElementById('submitBtn').click()">Проверить ответы</button>
                <div class="answer-map-panel" id="answerMapPanel" style="display:none;"><h3>Карта ответов по заданиям:</h3><div class="answer-map-grid" id="answerMapGrid"></div></div>
                <div id="resultBox" class="test-result" style="display:none;"></div>
            </aside>
        </div>
    </main>

    <script src="js/auth.js"></script><script src="js/menu.js"></script><script src="js/quiz-loader.js"></script><script src="js/premium.js"></script><script src="js/quiz.js"></script><script src="js/router.js"></script>
    <script>
    (function () {
        const EXPECTED_QUESTIONS = 45;
        function setupExamNavigation() {
            const grid=document.getElementById('questionGrid'), answerMap=document.getElementById('answerMapGrid'), container=document.getElementById('quizContainer'), total=document.getElementById('totalQuestions');
            if(!grid||!answerMap||!container)return;
            const blocks=Array.from(container.querySelectorAll('.question-block'));
            if(blocks.length<EXPECTED_QUESTIONS){setTimeout(setupExamNavigation,150);return;}
            grid.innerHTML='';answerMap.innerHTML='';
            blocks.slice(0,EXPECTED_QUESTIONS).forEach((block,index)=>{
                const text=block.querySelector('.question-text');const match=text&&text.textContent.match(/^(\d+)/);const number=match?match[1]:String(index+1);
                const button=document.createElement('button');button.type='button';button.className='question-number';button.textContent=number;button.addEventListener('click',()=>block.scrollIntoView({behavior:'smooth',block:'start'}));grid.appendChild(button);
                const mapButton=document.createElement('button');mapButton.type='button';mapButton.className='answer-map-cell';mapButton.textContent=number;mapButton.addEventListener('click',()=>block.scrollIntoView({behavior:'smooth',block:'start'}));answerMap.appendChild(mapButton);
            });
            if(total)total.textContent=String(EXPECTED_QUESTIONS);
            function isAnswered(block){return Array.from(block.querySelectorAll('input[type="radio"]')).some(i=>i.checked)||Array.from(block.querySelectorAll('input[type="text"]')).some(i=>i.value.trim()!=='')||Array.from(block.querySelectorAll('select')).some(s=>s.value!=='');}
            function updateStates(){blocks.slice(0,EXPECTED_QUESTIONS).forEach((block,index)=>{const button=grid.children[index],mapButton=answerMap.children[index];if(!button||!mapButton)return;const answered=isAnswered(block);button.classList.toggle('answered',answered);mapButton.classList.toggle('answered',answered);mapButton.classList.toggle('correct',block.classList.contains('question-correct'));mapButton.classList.toggle('incorrect',block.classList.contains('question-incorrect'));});}
            container.addEventListener('change',updateStates);container.addEventListener('input',updateStates);
            const current=document.getElementById('currentQuestion');const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(!entry.isIntersecting)return;const index=blocks.indexOf(entry.target);if(index<0||index>=EXPECTED_QUESTIONS)return;Array.from(grid.children).forEach((button,n)=>button.classList.toggle('current',n===index));Array.from(answerMap.children).forEach((button,n)=>button.classList.toggle('current',n===index));if(current)current.textContent=String(index+1);}),{root:null,rootMargin:'-18% 0px -62% 0px',threshold:0});
            blocks.slice(0,EXPECTED_QUESTIONS).forEach(block=>observer.observe(block));const mutationObserver=new MutationObserver(updateStates);blocks.slice(0,EXPECTED_QUESTIONS).forEach(block=>mutationObserver.observe(block,{attributes:true,attributeFilter:['class']}));updateStates();
        }
        function syncSidebarTimer(){const mainTimer=document.getElementById('timer'),sidebar=document.getElementById('sidebarTimer');if(!mainTimer||!sidebar){setTimeout(syncSidebarTimer,200);return;}const sync=()=>{sidebar.textContent=mainTimer.textContent;sidebar.classList.toggle('timer--warning',mainTimer.classList.contains('timer--warning'));};new MutationObserver(sync).observe(mainTimer,{childList:true,characterData:true,subtree:true,attributes:true});sync();}
        function showAnswerMapAfterSubmit(){const panel=document.getElementById('answerMapPanel');if(!panel)return;const check=()=>{if(window.quizSubmitted===true){panel.style.display='';return;}setTimeout(check,250);};check();}
        function initExamUI(){setupExamNavigation();syncSidebarTimer();showAnswerMapAfterSubmit();}
        if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initExamUI);else initExamUI();
    })();
    </script>
</body>
</html>
