<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netija</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./images/favicon.svg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="test.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header__container">
            <nav class="header__nav">
                <img class="logo" src="./images/logo.svg" alt="">
                <ul class="header__list">
                    <li class="header__list-item"><a class="header__list-link" href="index.html">Главная страница</a></li>
                    <li class="header__list-item"><a class="header__list-link" href="/">Дтм</a></li>
                    <li class="header__list-item"><a class="header__list-link active" href="natcert.html">Национальный сертификат</a></li>
                </ul>
                <div class="sign__button" id="googleSignInButton"></div>
                <div id="userProfile" class="user-profile" style="display: none;">
                    <img id="userAvatar" class="user-profile__avatar" src="" alt="">
                    <span id="userName" class="user-profile__name"></span>
                </div>
                <button class="burger" id="burgerBtn" aria-label="Меню">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </nav>
        </div>
    </header>

    <main class="main__natcert" id="main">
    <h1 class="test-title">Национальный сертификат</h1>
    <p class="test-subtitle">Выбери тест и начни подготовку</p>
    <div class="test-cards" id="testCards"></div>
</main>  
    
    <script src="js/auth.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/natcert_tests-list.js"></script>
    <script src="js/render-cards.js"></script>
    <script src="js/router.js"></script>  

    <!-- Скрипт подгрузки результатов на карточки -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const cards = document.querySelectorAll('.test-card');
            if (!cards.length) return;

            try {
                // Запрашиваем результаты пользователя с бэкенда
                const response = await fetch('/api/get-user-results.php');
                
                if (!response.ok) return;
                const results = await response.json(); 

                cards.forEach(card => {
                    const testId = card.getAttribute('data-test-id');
                    const statusBox = card.querySelector('.card-status');
                    const btn = card.querySelector('.btn-card-action');

                    // Находим сохранённый результат для этого теста
                    const userResult = results.find(r => r.testId === testId);

                    if (userResult && statusBox) {
                        const isGood = userResult.percent >= 70;
                        const badgeClass = isGood ? 'card-badge--success' : 'card-badge--warning';

                        // 1. Выводим плашку с баллами
                        statusBox.innerHTML = `
                            <div class="card-badge ${badgeClass}">
                                <span>✓ Результат: ${userResult.score}/${userResult.maxScore} (${userResult.percent}%)</span>
                            </div>
                        `;

                        // 2. Меняем кнопку на "Пройти повторно"
                        if (btn) {
                            btn.textContent = 'Пройти повторно';
                            btn.classList.add('completed');
                        }
                    }
                });

            } catch (error) {
                console.log('Пользователь не авторизован или ошибка сети');
            }
        });
    </script>
</body>
</html>
