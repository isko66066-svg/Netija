<style>
.dtm-test-page{max-width:1240px;margin:0 auto;padding:30px 22px 70px}.dtm-exam-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:24px}.dtm-exam-kicker{display:inline-flex;padding:6px 11px;border-radius:999px;background:#eef3ff;color:#3157c7;font-size:12px;font-weight:800;letter-spacing:.05em}.dtm-test-title{margin:12px 0 6px;color:#08172d;font-size:clamp(28px,4vw,42px);line-height:1.08}.dtm-exam-subtitle{margin:0;color:#64748b}.dtm-exam-progress{min-width:105px;padding:14px 17px;border:1px solid #e5eaf1;border-radius:16px;background:#fff;color:#0f172a;text-align:center;box-shadow:0 8px 25px rgba(15,23,42,.05);font-size:20px}.dtm-exam-progress span{display:block;font-size:11px;color:#94a3b8;font-weight:600;margin-top:2px}.dtm-exam-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px;align-items:start}.dtm-question-list{display:grid;gap:16px}.dtm-question-card{scroll-margin-top:20px;background:#fff;border:1px solid #e5eaf1;border-radius:20px;padding:22px;display:grid;grid-template-columns:42px minmax(0,1fr);gap:16px;box-shadow:0 8px 28px rgba(15,23,42,.05)}.dtm-question-number{width:42px;height:42px;border-radius:13px;background:#eef3ff;color:#3157c7;display:grid;place-items:center;font-weight:800}.dtm-question-text{font-size:18px;line-height:1.55;color:#0f172a;font-weight:600;white-space:pre-wrap}.dtm-question-image{display:block;max-width:100%;max-height:380px;margin:18px auto;border-radius:12px;border:1px solid #e5e7eb}.dtm-options{display:grid;gap:10px;margin-top:18px}.dtm-option{width:100%;display:flex;align-items:center;gap:12px;border:1px solid #dbe2ec;background:#f8fafc;border-radius:13px;padding:12px 14px;text-align:left;font:inherit;cursor:pointer;color:#0f172a;transition:.15s}.dtm-option:hover{border-color:#3157c7;background:#f2f5ff}.dtm-option.selected{border-color:#3157c7;background:#eaf0ff;box-shadow:0 0 0 2px rgba(49,87,199,.08)}.dtm-option-letter{width:30px;height:30px;border-radius:9px;background:#fff;border:1px solid #dbe2ec;display:grid;place-items:center;font-weight:800;flex:0 0 30px;color:#334155}.dtm-option.selected .dtm-option-letter{background:#3157c7;color:#fff;border-color:#3157c7}.dtm-missing-key{margin:14px 0 0;color:#94a3b8;font-size:13px}.dtm-sidebar{position:sticky;top:18px}.dtm-sidebar-card{background:#fff;border:1px solid #e5eaf1;border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(15,23,42,.06)}.dtm-sidebar-title{font-size:20px;font-weight:800;color:#0f172a;margin-bottom:14px}.dtm-legend{display:grid;gap:8px;margin-bottom:16px;color:#64748b;font-size:12px}.dtm-legend span{display:flex;align-items:center;gap:8px}.dtm-legend i{width:9px;height:9px;border-radius:50%;background:#e2e5e9}.dtm-legend i.answered{background:#35c879}.dtm-legend i.current{background:#fff;border:2px solid #3b82f6}.dtm-question-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.dtm-nav-number{height:43px;border:0;border-radius:10px;background:#eef3f8;color:#334155;font-weight:700;cursor:pointer;transition:.15s}.dtm-nav-number:hover{background:#e5ebf4}.dtm-nav-number.answered{background:#dff7e9;color:#16834b}.dtm-nav-number.current{outline:2px solid #3b82f6;outline-offset:1px;background:#fff;color:#3157c7}.dtm-nav-number.answered.current{background:#dff7e9}.dtm-finish{width:100%;margin-top:18px;border:0;border-radius:13px;padding:13px 15px;background:#ff4d4d;color:#fff;font-weight:800;cursor:pointer}.dtm-finish:hover{filter:brightness(.96)}.dtm-result{background:#fff;border:1px solid #e5eaf1;border-radius:22px;padding:40px;text-align:center;box-shadow:0 10px 30px rgba(15,23,42,.06)}.dtm-result h2{margin:14px 0 8px;font-size:30px}.dtm-score{font-size:52px;font-weight:800;color:#3157c7}.dtm-result p{color:#64748b}.dtm-result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}.dtm-btn{border:0;border-radius:13px;padding:12px 18px;font-weight:700;cursor:pointer}.dtm-btn--next{background:#08172d;color:#fff}.dtm-link{display:inline-block;text-decoration:none;border-radius:12px;padding:11px 16px;font-weight:700;background:#08172d;color:#fff}.dtm-link.secondary{background:#eef2f7;color:#334155}@media(max-width:850px){.dtm-exam-layout{grid-template-columns:1fr}.dtm-sidebar{position:sticky;top:0;z-index:10}.dtm-sidebar-card{border-radius:0 0 18px 18px}.dtm-question-nav{grid-template-columns:repeat(10,1fr)}}@media(max-width:600px){.dtm-test-page{padding:22px 12px 50px}.dtm-exam-head{align-items:flex-start;flex-direction:column}.dtm-exam-progress{align-self:stretch}.dtm-question-card{grid-template-columns:34px minmax(0,1fr);padding:16px;gap:11px}.dtm-question-number{width:34px;height:34px;border-radius:10px}.dtm-question-text{font-size:16px}.dtm-question-nav{grid-template-columns:repeat(5,1fr)}}
</style>
