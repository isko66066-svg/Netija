<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netija — Национальный сертификат</title>

    <link rel="stylesheet" href="style.css?v=20260821">
    <link rel="shortcut icon" href="./images/favicon.svg" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <header class="header">
        <div class="header__container">
            <nav class="header__nav">
                <a class="site-header__logo" href="index.html" aria-label="Netija">
                    <img class="logo" src="./images/logo.svg" alt="Netija">
                </a>

                <ul class="header__list">
                    <li class="header__list-item">
                        <a class="header__list-link" href="index.html">
                            Главная страница
                        </a>
                    </li>
                    <li class="header__list-item">
                        <a class="header__list-link" href="/">
                            Дтм
                        </a>
                    </li>
                    <li class="header__list-item">
                        <a class="header__list-link active" href="natcert.html">
                            Национальный сертификат
                        </a>
                    </li>
                </ul>

                <div class="site-header__account">
                    <a class="premium-nav-link" href="premium.html">
                        👑 Premium
                    </a>

                    <div class="sign__button" id="googleSignInButton"></div>

                    <div id="userProfile" class="user-profile" style="display: none;">
                        <img id="userAvatar" class="user-profile__avatar" src="" alt="">
                        <span id="userName" class="user-profile__name"></span>
                    </div>

                    <button
                        class="burger"
                        id="burgerBtn"
                        type="button"
                        aria-label="Меню"
                    >
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <main class="main__natcert" id="main">
        <h1 class="test-title">Национальный сертификат</h1>
        <p class="test-subtitle">Выбери тест и начни подготовку</p>

        <div class="filter-container" aria-label="Фильтр по году">
            <button class="filter-btn active" data-filter="all" type="button">
                Все
            </button>
            <button class="filter-btn" data-filter="2026" type="button">
                2026
            </button>
            <button class="filter-btn" data-filter="2025" type="button">
                2025
            </button>
            <button class="filter-btn" data-filter="2024" type="button">
                2024
            </button>
        </div>

        <div class="test-cards" id="testCards"></div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/premium-header.js"></script>
    <script src="js/natcert_tests-list.js"></script>
    <script src="js/render-cards.js"></script>
    <script src="js/router.js"></script>
</body>
</html>
