name: Format NatCert tests

on:
  push:
    branches: [main]
    paths:
      - 'js/questions/natcert-13.js'
      - 'js/questions/natcert-14.js'
      - '.github/workflows/format-natcert.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format test files
        run: npx --yes prettier@3.6.2 --write js/questions/natcert-13.js js/questions/natcert-14.js

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git add js/questions/natcert-13.js js/questions/natcert-14.js
          git commit -m "Format NatCert test files"
          git push
