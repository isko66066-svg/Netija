name: Format quiz files

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip format]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format quiz files
        run: npx --yes prettier@3.6.2 --write test.css quiz.js js/quiz.js

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test.css quiz.js js/quiz.js
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "Format quiz CSS and JS [skip format]"
          git push
